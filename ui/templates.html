<template id="wf-page-template">
  <div class="content d-none wf-ui" id="worker-folks-container">
    <div class="skill-info">
      <skill-header data-skill-id="worker_folks:Hiring"></skill-header>
    </div>
    <!-- One column of blocks (build .98): the Overview, with the Payroll Reserve in it, is built here in JS
         (src/dashboard.mjs); layout.mjs moves the cards' grid in beside it so either can go first. -->
    <div data-wf="blocks"></div>
    <div class="row row-deck" id="worker-folks-folks">
      <div class="col-12" id="worker-folks-empty">
        <div class="block block-rounded border-top border-worker-folks border-4x text-center p-3">
          <h5 class="font-w600 mb-1"><lang-string lang-id="MOD_WF_NO_WORKERS"></lang-string></h5>
          <div class="mb-1" data-wf="empty-desc"><lang-string lang-id="MOD_WF_NO_WORKERS_DESC"></lang-string></div>
          <div class="wf-subtle mb-2" data-wf="empty-note"><lang-string lang-id="MOD_WF_DASH_HIRING_XP"></lang-string></div>
          <button type="button" class="btn btn-outline-info" data-wf="open-shop"><lang-string lang-id="MOD_WF_BUTTON_OPEN_SHOP"></lang-string></button>
        </div>
      </div>
    </div>
  </div>
</template>

<template id="wf-folk-card-template">
  <div class="col-12 col-md-6 col-xl-4">
    <!-- Sections: who, work, health, strike (only on a strike or debt), actions.
         The card is a flex column and the actions band sits at the bottom. Closed cards in a row share one height;
         open Details grow only their own card (equalizeCards in cards.mjs, build .61). -->
    <div class="block block-rounded border-top border-worker-folks border-4x wf-card" role="group">
      <div class="block-content p-3 wf-card-body">
        <div class="wf-band wf-band-who">
          <div class="d-flex align-items-start">
            <img class="wf-card-portrait mr-3" data-wf="portrait" alt="" />
            <div class="flex-fill wf-min0">
              <div class="d-flex justify-content-between align-items-start">
                <div class="wf-min0">
                  <!-- The whole name, wrapping onto balanced lines (scan A-06, C-12, build .112); "· Slot N" never splits (A-11). -->
                  <h5 class="font-w600 mb-0 wf-card-name" data-wf="name"></h5>
                  <small class="wf-subtle"><span data-wf="role"></span> <span class="text-nowrap">&middot; <span data-wf="slot"></span></span></small>
                </div>
                <span class="badge wf-status wf-card-status">
                  <img class="wf-status-icon" data-wf="status-icon" alt="" />
                  <span data-wf="status-text"></span>
                </span>
              </div>
              <div class="wf-card-badges">
                <span class="badge badge-info" data-wf="rate"></span>
                <span class="badge badge-warning" data-wf="wage"></span>
              </div>
              <div class="wf-effects wf-subtle" data-wf="effects"></div>
            </div>
          </div>
        </div>
        <div class="wf-band wf-band-work">
          <div class="d-flex align-items-center justify-content-center wf-gap">
            <span class="font-w700 wf-card-skill" data-wf="skill"></span>
            <button type="button" class="btn btn-sm btn-danger d-none" data-wf="stop"></button>
          </div>
          <small class="d-block text-center" data-wf="detail"></small>
          <mastery-display class="wf-mastery mt-1" data-wf="mastery"></mastery-display>
        </div>
        <div class="wf-band wf-band-health text-center" data-wf="hp">
          <div class="progress wf-hp-bar"><div class="progress-bar bg-danger" role="progressbar" data-wf="hp-bar"></div></div>
          <small class="d-block" data-wf="hp-text"></small>
          <small class="d-block" data-wf="food"></small>
        </div>
        <div class="wf-band wf-band-strike d-none" data-wf="strike">
          <div class="d-block font-w600" data-wf="strike-owed"></div>
          <div class="wf-block font-w600 text-danger d-none" data-wf="strike-severance"></div>
          <div class="wf-card-actions wf-stack mt-1">
            <button type="button" class="btn btn-sm btn-outline-success" data-wf="apologise"></button>
            <button type="button" class="btn btn-sm btn-success" data-wf="settle"></button>
          </div>
          <small class="wf-block text-warning mt-1 d-none" data-wf="strike-why"></small>
        </div>
        <div class="wf-band wf-band-actions">
          <!-- Promote on a line of its own, full width like the HP bar, so Fire never wraps (build .61, user layout);
               above Details, Gear and Fire (build .66). -->
          <div class="wf-promote-row mb-2" data-wf="promote-row">
            <button type="button" class="btn btn-sm btn-outline-primary btn-block" data-wf="promote"></button>
          </div>
          <div class="wf-card-actions">
            <button type="button" class="btn btn-sm btn-outline-info" data-wf="expand" aria-expanded="false"></button>
            <button type="button" class="btn btn-sm btn-outline-info" data-wf="gear"></button>
            <button type="button" class="btn btn-sm btn-outline-danger ml-auto" data-wf="fire"></button>
          </div>
          <!-- Why Promote, Gear or Fire is grey: another mod's refusal (Voyage), in Worker Folks' own card. -->
          <small class="wf-block text-warning mt-1 d-none" data-wf="staff-why"></small>
          <div class="wf-details d-none mt-2" data-wf="details">
            <div class="wf-band-head mb-1" data-wf="perks-title"></div>
            <ul class="pl-3 mb-2" data-wf="perks"></ul>
            <button type="button" class="btn btn-sm btn-outline-warning d-none" data-wf="overtime" aria-pressed="false"></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<template id="wf-frozen-slot-template">
  <div class="col-12 col-md-6 col-xl-4">
    <div class="block block-rounded border-top border-secondary border-4x wf-card wf-frozen">
      <div class="block-content p-3 d-flex align-items-center">
        <img class="wf-card-portrait mr-3 wf-frozen-portrait" data-wf="portrait" alt="" />
        <div>
          <h5 class="font-w600 mb-0" data-wf="title"><span data-wf="title-text"></span><button type="button" class="btn btn-sm wf-help" data-wf-help="frozen"><i class="fa fa-question-circle" aria-hidden="true"></i></button></h5>
          <div class="text-warning font-w600" data-wf="text"></div>
        </div>
      </div>
    </div>
  </div>
</template>

<template id="wf-skill-control-template">
  <div class="block block-rounded border-top border-worker-folks border-4x wf-skill-control wf-ui mb-3">
    <div class="block-content p-2 d-flex align-items-center flex-wrap">
      <img class="skill-icon-xs mr-2" data-wf="icon" alt="" />
      <span class="font-w600 mr-2"><lang-string lang-id="MOD_WF_CTRL_LABEL"></lang-string>:</span>
      <button type="button" class="btn btn-sm btn-outline-info wf-ctrl-button mr-3 my-1" data-wf="folk-button"></button>
      <small class="text-muted mr-3 my-1" data-wf="status"></small>
      <!-- Where the line sends the player, a link there (scan B-37, C-04, build .112). -->
      <button type="button" class="btn btn-sm btn-outline-info my-1 mr-2 d-none" data-wf="goto"></button>
      <button type="button" class="btn btn-sm btn-danger my-1 d-none" data-wf="stop"></button>
    </div>
  </div>
</template>
